<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Parakletos International School | Class PIN Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/images/auth/para logo.jpeg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f5f7;
  padding: 30px;
}
.card-header {
  background: linear-gradient(135deg, #c8102e, #b95157);
  color: white;
  font-weight: 700;
}
.pin {
  font-weight: 800;
  letter-spacing: 1px;
  color: #c8102e;
}
</style>
</head>
<body>

<div class="dashboard-main-body">

  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <h6 class="fw-semibold mb-0">Class PINs Management</h6>
    <ul class="d-flex align-items-center gap-2 mb-0">
      <li class="fw-medium">
        <a href="admin-dashboard.html" class="d-flex align-items-center gap-1 text-decoration-none text-dark">
          Dashboard
        </a>
      </li>
      <li>-</li>
      <li class="fw-medium">Class PIN Table</li>
    </ul>
  </div>

  <!-- PIN Table Card -->
  <div class="card">
    <div class="card-header">Available Class PINs</div>
    <div class="card-body">
      <table class="table table-bordered text-center table-striped">
        <thead>
          <tr>
            <th>S.L</th>
            <th>Class</th>
            <th>Term</th>
            <th>PIN</th>
            <th>Date Generated</th>
          </tr>
        </thead>
        <tbody id="pinTable">
          <tr>
            <td colspan="5">Loading PINs...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyBqBTuNUD2pf2XUVnhKH9t7PyVSmQtD4c4",
  databaseURL: "https://parakletos-result-default-rtdb.firebaseio.com"
});

const db = getDatabase(app);

// Generate PIN
window.generatePin = async function(){
  const cls = document.getElementById("class").value.trim();
  const term = document.getElementById("term").value;

  if(!cls) return alert("Enter class");

  const pin = Math.floor(100000 + Math.random()*900000).toString();

  await set(ref(db, `ClassPins/${term}/${cls}`), {
    pin,
    createdAt: Date.now()
  });

  const out = document.getElementById("output");
  out.innerHTML = `PIN for <strong>${cls}</strong> (${term}): <span class="pin">${pin}</span>`;
  loadPins();
};

// Load all pins
async function loadPins(){
  const tbody = document.getElementById("pinTable");
  tbody.innerHTML = "";

  const snap = await get(ref(db,"ClassPins"));
  if(!snap.exists()) {
    tbody.innerHTML = `<tr><td colspan="5">No PINs available</td></tr>`;
    return;
  }

  let index = 1;
  const data = snap.val();

  for(const term in data){
    for(const cls in data[term]){
      const p = data[term][cls];
      const date = new Date(p.createdAt).toLocaleString();

      tbody.innerHTML += `
        <tr>
          <td>${index++}</td>
          <td>${cls}</td>
          <td>${term}</td>
          <td class="pin">${p.pin}</td>
          <td>${date}</td>
        </tr>`;
    }
  }
}

loadPins();
</script>

</body>
</html>

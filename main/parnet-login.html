<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parent Result Portal</title>
 <link rel="icon" type="image/png" href="assets/images/auth/para logo.jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --primary: #c8102e;
  --secondary: #b95157;
  --bg-light: #f6f7fb;
  --text-dark: #333;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* Main Card */
.portal-card {
  background: #fff;
  width: 100%;
  max-width: 460px;
  border-radius: 20px;
  padding: 35px 30px 30px;
  box-shadow: 0 30px 70px rgba(0,0,0,.25);
  animation: fadeIn .6s ease;
}

/* Header */
.portal-header {
  text-align: center;
  margin-bottom: 25px;
}

.portal-header img {
  width: 70px;
  margin-bottom: 10px;
}

.portal-header h2 {
  margin: 0;
  color: var(--primary);
  font-size: 22px;
  font-weight: 700;
}

.portal-header p {
  margin: 6px 0 0;
  font-size: 14px;
  color: #666;
}

/* Form */
.form-group {
  margin-bottom: 16px;
}

label {
  display: block;
  font-size: 13px;
  color: #555;
  margin-bottom: 6px;
}

input, select {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid #ddd;
  background: #fafafa;
  outline: none;
  transition: all .3s ease;
}

input:focus,
select:focus {
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(200,16,46,.1);
}

/* Button */
button {
  width: 100%;
  padding: 15px;
  margin-top: 8px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 20px rgba(200,16,46,.3);
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

/* Footer */
.portal-footer {
  text-align: center;
  font-size: 12px;
  color: #888;
  margin-top: 25px;
}

/* Animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Responsive */
@media (max-width: 480px) {
  .portal-card {
    padding: 28px 22px;
  }

  .portal-header h2 {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="portal-card">

  <div class="portal-header">
    <img src="assets/images/auth/para logo.jpeg" alt="School Logo">
    <h2>Parent Result Portal</h2>
    <p>Secure access to your child’s academic results</p>
  </div>

  <div class="form-group">
    <label for="studentID">Student ID</label>
    <input id="studentID" placeholder="Enter Student ID">
  </div>

  <div class="form-group">
    <label for="studentClass">Academic Class</label>
    <select id="studentClass" placeholder="e.g. Grade 1">
      <option value="">Select Class</option>
                  <option>Pre Nusery</option>
                  <option>Nusery 1</option>
                  <option>Nusery 2</option>
                  <option>Prep-Grade</option>
                  <option>Grade 1</option>
                  <option>Grade 2</option>
                  <option>Grade 3</option>
                  <option>Grade 4</option>
                  <option>Grade 5</option>
                  <option>JSS 1</option>
                  <option>JSS 2</option>
                  <option>JSS 3</option>
                  <option>SSS 1</option>
                  <option>SSS 2</option>
                  <option>SSS 3</option>
    </select>
  </div>


  <div class="form-group">
    <label for="term">Academic Term</label>
    <select id="term">
      <option value="">Select Term</option>
      <option>First Term</option>
      <option>Second Term</option>
      <option>Third Term</option>
    </select>
  </div>

  <div class="form-group">
    <label for="pin">Result PIN</label>
    <input id="pin" placeholder="Enter Result PIN">
  </div>

  <button onclick="loginParent()" id="btn">View Result</button>

  <div class="portal-footer">
    © 2026 Parakletos International School<br>
    All Rights Reserved
  </div>

</div>

<script type="module" src="assets/js/parnet-login.js"></script>

</body>
</html>
